<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AvatarForms - Testing</title>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<script>
			// On page load, check localStorage or system defaults
			if (localStorage.getItem('color-theme') === 'dark' || 
				(!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
				document.documentElement.classList.add('dark');
			} else {
				document.documentElement.classList.remove('dark');
			}
		</script>
		<link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet"/>
		<link href="css/styles.css" rel="stylesheet"/>
	</head>
	<body class="min-h-screen flex flex-col">
		<nav id="navbar-container" class="fixed top-0 w-full z-50"></nav>

		<!-- Layout Container -->
		<div class="flex flex-1 pt-16">
			<aside id="sidebar-container" class="w-64 flex"></aside>

			<!-- Main content area -->
			<main class="flex-1 w-full max-w-[1400px] mx-auto py-6 px-4 sm:px-6 lg:px-8">
				<div id="breadcrumbs-container" class="mb-6"></div>

				<section class="af-stack">
					<div class="af-stack">
						<h1 class="text-5xl text-font-bold text-gradient-brand">Testing</h1>
						<p class="af-section-subtitle">Template page for testing documentation and results.</p>
					</div>

					<ul class="af-tabs" id="testing-tabs" role="tablist" aria-label="Testing tabs">
						<li class="me-2" role="presentation">
							<button class="af-tab-link" id="testing-unit-tab" data-tabs-target="#testing-unit-panel" type="button" role="tab" aria-controls="testing-unit-panel" aria-selected="true">Unit Testing & Integration Testing</button>
						</li>
						<li class="me-2" role="presentation">
							<button class="af-tab-link" id="testing-integration-tab" data-tabs-target="#testing-integration-panel" type="button" role="tab" aria-controls="testing-integration-panel" aria-selected="false">Performance Testing</button>
						</li>
						<li class="me-2" role="presentation">
							<button class="af-tab-link" id="testing-system-tab" data-tabs-target="#testing-system-panel" type="button" role="tab" aria-controls="testing-system-panel" aria-selected="false">Compatibility Testing</button>
						</li>
						<li role="presentation">
							<button class="af-tab-link" id="testing-acceptance-tab" data-tabs-target="#testing-acceptance-panel" type="button" role="tab" aria-controls="testing-acceptance-panel" aria-selected="false">User Acceptance Testing</button>
						</li>
					</ul>

					<div id="testing-tab-content">
						<div class="af-tab-panel" id="testing-unit-panel" role="tabpanel" aria-labelledby="testing-unit-tab">
							<div class="af-card">
								<div class="af-card-title-row">
									<span class="af-card-title text-gradient-brand">Unit Testing</span>
									<span class="gradient-brand-bar bar-thin"></span>
								</div>
								<p class="af-card-text">Content placeholder.</p>
							</div>
						</div>

						<div class="af-tab-panel hidden" id="testing-integration-panel" role="tabpanel" aria-labelledby="testing-integration-tab">
							<div class="af-card">
								<div class="af-card-title-row">
									<span class="af-card-title text-gradient-brand">Integration Testing</span>
									<span class="gradient-brand-bar bar-thin"></span>
								</div>
								<p class="af-card-text">Content placeholder.</p>
							</div>
						</div>

						<div class="af-tab-panel hidden" id="testing-system-panel" role="tabpanel" aria-labelledby="testing-system-tab">
							<div class="af-card">
								<div class="af-card-title-row">
									<span class="af-card-title text-gradient-brand">System Testing</span>
									<span class="gradient-brand-bar bar-thin"></span>
								</div>
								<p class="af-card-text">Content placeholder.</p>
							</div>
						</div>

						<div class="af-tab-panel hidden" id="testing-acceptance-panel" role="tabpanel" aria-labelledby="testing-acceptance-tab">
							<div class="af-card">
								<div class="af-card-title-row">
									<span class="af-card-title text-gradient-brand">Acceptance Testing</span>
									<span class="gradient-brand-bar bar-thin"></span>
								</div>
								<p class="af-card-text">Content placeholder.</p>
							</div>
						</div>
					</div>
				</section>
			</main>
		</div>

		<div id="footer-placeholder"></div>

		<script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
		<script>
			const breadcrumbPaths = {
				'index.html': [{ title: 'Home', href: 'index.html' }],
				'testing.html': [
					{ title: 'Home', href: 'index.html' },
					{ title: 'Testing', href: 'testing.html' }
				]
			};

			function addCurrentBreadcrumb() {
				const breadcrumbsList = document.getElementById('breadcrumbs-list');
				if (!breadcrumbsList) return;

				const currentPath = window.location.pathname.split('/').pop() || 'index.html';
				const trail = breadcrumbPaths[currentPath] || [
					{ title: 'Home', href: 'index.html' },
					{ title: 'Page' }
				];

				if (currentPath === 'index.html') return;

				trail.slice(1).forEach((crumb, index) => {
					const isLast = index === trail.slice(1).length - 1;
					const listItem = document.createElement('li');
					listItem.className = 'inline-flex items-center gap-2 text-body';

					const separator = `
						<svg class="w-3 h-3 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
							<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
						</svg>
					`;

					if (isLast || !crumb.href) {
						listItem.innerHTML = `${separator}<span aria-current="page">${crumb.title}</span>`;
					} else {
						listItem.innerHTML = `${separator}<a href="${crumb.href}" class="hover:text-fg-brand">${crumb.title}</a>`;
					}

					breadcrumbsList.appendChild(listItem);
				});
			}

			function initAfTabs(tabListId, panelContainerId) {
				const tabList = document.getElementById(tabListId);
				const panelContainer = document.getElementById(panelContainerId);
				if (!tabList || !panelContainer) return;

				const tabs = Array.from(tabList.querySelectorAll('[role="tab"][data-tabs-target]'));
				const panels = Array.from(panelContainer.querySelectorAll('[role="tabpanel"]'));
				if (!tabs.length || !panels.length) return;

				const activateTab = (selectedTab) => {
					const targetSelector = selectedTab.getAttribute('data-tabs-target');
					if (!targetSelector) return;

					tabs.forEach((tab) => {
						const isActive = tab === selectedTab;
						tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
						tab.tabIndex = isActive ? 0 : -1;
					});

					panels.forEach((panel) => panel.classList.add('hidden'));

					const activePanel = panelContainer.querySelector(targetSelector);
					if (activePanel) activePanel.classList.remove('hidden');
				};

				tabs.forEach((tab) => {
					tab.addEventListener('click', () => activateTab(tab));
				});

				const initiallySelected = tabs.find((tab) => tab.getAttribute('aria-selected') === 'true') || tabs[0];
				activateTab(initiallySelected);
			}

			fetch('components/navbar.html')
				.then(response => response.text())
				.then(data => {
					document.getElementById('navbar-container').innerHTML = data;
				})
				.catch(error => console.error('Error loading navbar:', error));

			fetch('components/sidebar.html')
				.then(response => response.text())
				.then(data => {
					document.getElementById('sidebar-container').innerHTML = data;
				})
				.catch(error => console.error('Error loading sidebar:', error));

			fetch('components/breadcrumbs.html')
				.then(response => response.text())
				.then(data => {
					document.getElementById('breadcrumbs-container').innerHTML = data;
					addCurrentBreadcrumb();
				})
				.catch(error => console.error('Error loading breadcrumbs:', error));

			fetch('components/footer.txt')
				.then(response => response.text())
				.then(data => {
					document.getElementById('footer-placeholder').innerHTML = data;
				})
				.catch(error => console.error('Error loading footer:', error));

			initAfTabs('testing-tabs', 'testing-tab-content');
		</script>
	</body>
</html>
